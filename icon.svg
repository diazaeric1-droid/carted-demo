<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#152040"/>
      <stop offset="55%" stop-color="#0D1328"/>
      <stop offset="100%" stop-color="#070B16"/>
    </radialGradient>
    <filter id="cy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pk" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint dot grid -->
  <g fill="#DFE9FF" opacity="0.055">
    <circle cx="128" cy="128" r="6"/><circle cx="384" cy="128" r="6"/><circle cx="640" cy="128" r="6"/><circle cx="896" cy="128" r="6"/>
    <circle cx="128" cy="384" r="6"/><circle cx="896" cy="384" r="6"/>
    <circle cx="128" cy="640" r="6"/><circle cx="896" cy="640" r="6"/>
    <circle cx="128" cy="896" r="6"/><circle cx="384" cy="896" r="6"/><circle cx="640" cy="896" r="6"/><circle cx="896" cy="896" r="6"/>
  </g>

  <!-- crescent moon -->
  <path d="M 838 112 A 58 58 0 1 0 838 224 A 72 72 0 1 1 838 112 Z" fill="#EFD9A0" opacity="0.9" filter="url(#soft)"/>

  <!-- sparkles -->
  <path d="M258 268 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14 Z" fill="#4DE3FF" opacity="0.85" filter="url(#cy)"/>
  <path d="M764 396 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 Z" fill="#FF4D9E" opacity="0.8" filter="url(#pk)"/>

  <!-- ghost (cyan aura, soft-white body) -->
  <g filter="url(#soft)">
    <path d="M322 470 C322 330 400 244 480 244 C560 244 638 330 638 470 L638 612 C616 586 596 586 576 612 C556 638 536 638 516 612 C496 586 476 586 456 612 C436 638 416 638 396 612 C376 586 356 586 338 612 L322 612 Z" fill="#4DE3FF" opacity="0.35"/>
  </g>
  <path d="M322 470 C322 330 400 244 480 244 C560 244 638 330 638 470 L638 612 C616 586 596 586 576 612 C556 638 536 638 516 612 C496 586 476 586 456 612 C436 638 416 638 396 612 C376 586 356 586 338 612 L322 612 Z" fill="#F4F8FF"/>
  <!-- face -->
  <ellipse cx="434" cy="428" rx="17" ry="25" fill="#0D1328"/>
  <ellipse cx="528" cy="428" rx="17" ry="25" fill="#0D1328"/>
  <path d="M448 486 Q481 514 514 486" stroke="#0D1328" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="398" cy="470" r="17" fill="#FF4D9E" opacity="0.55"/>
  <circle cx="564" cy="470" r="17" fill="#FF4D9E" opacity="0.55"/>

  <!-- cart: pink neon line-art -->
  <g stroke="#FF4D9E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pk)">
    <path d="M296 596 L342 780 L618 780 L664 596 Z"/>
    <path d="M382 596 L404 780 M480 596 L480 780 M578 596 L556 780"/>
    <path d="M320 688 L640 688"/>
    <path d="M664 596 L724 452 L768 452"/>
  </g>
  <g stroke="#4DE3FF" stroke-width="20" fill="#0D1328" filter="url(#cy)">
    <circle cx="404" cy="850" r="30"/>
    <circle cx="556" cy="850" r="30"/>
  </g>
</svg>
